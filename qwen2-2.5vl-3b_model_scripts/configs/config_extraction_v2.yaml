# config_extractor_full_page.yaml — Pipeline 1: Full page -> field values (JSON), no cropping.

task_name: "extractor_full_page"
task_type: "extraction"   # trainer.py branches dataset/metrics selection on this

paths:
  annotation_results: "data/field_annotation_results_run4.jsonl"   # see prepare_dataset_extraction.py for schema
  image_dir: "data/SRF_images"
  prepared_dir: "data/prepared_extraction_run4"
  train_jsonl: "data/prepared_extraction_run4/train.jsonl"
  val_jsonl: "data/prepared_extraction_run4/val.jsonl"
  test_jsonl: "data/prepared_extraction_run4/test.jsonl"
  output_dir: "out_run4/extraction_checkpoints_1"
  logs_dir: "out_run4/extraction_logs_1"
  infer_output_dir: "out_run4/extraction_inference"

training_flags:
  resume_from_last_checkpoint: false

model:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  torch_dtype: "float16"      # T4 has no native bf16 support
  device_map: "mps"
  attn_implementation: "sdpa"
  load_in_4bit: true

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  supported_image_extensions: [".png", ".jpg", ".jpeg", ".tiff", ".tif"]
  val_split: 0.10
  test_split: 0.10
  seed: 42

processor:
  min_pixels: 200704   # 256 * 28 * 28
  max_pixels: 802816   # 1024 * 28 * 28
  # Full pages carry more/smaller text than a cropped section did for the detector —
  # if field accuracy is poor on small text, raise max_pixels first before anything else.

system_prompt: "You are a precise medical document analyzer. You extract structured field values from fax images."

task_description: |

  You are an expert medical document analyst specializing in structured data extraction from faxed Service Request Forms (SRFs).
  
  CRITICAL EXTRACTION RULES:
  1. Extract values EXACTLY as they appear on the document. Do not assume, infer, or extrapolate missing data.
  2. If a field is blank, illegible, or not present on the page, output `null` (or an empty list `[]` for list fields). NEVER guess.
  3. DATETIME FORMAT: Standardize all dates to YYYY-MM-DD if the components are clear (e.g., 2026-03-16).
  4. CODES: Strip all extraneous punctuation for codes and NPIs where possible, keeping alphanumeric characters clean.
  5. JSON OUTPUT: Respond ONLY with a valid JSON object matching the requested schema. No conversational text, explanations, or markdown code blocks.

fields:
  - name: "diagnoses"
    required: false
    field_type: "list"
    item_schema:
      - name: "diagnosisCode"
        match_type: "code"
  - name: "procedures"
    required: false
    field_type: "list"
    item_schema:
      - name: "procedureCode"
        match_type: "code"
      - name: "dateOfServiceStart"
        match_type: "date"
      - name: "dateOfServiceEnd"
        match_type: "date"
      - name: "numberOfVisits"
        match_type: "numeric"
  - name: "servicing_provider_npi"
    required: false
    match_type: "code"
  - name: "type_of_service"
    required: false
    match_type: "fuzzy_text"
  - name: "member_id"
    required: false
    match_type: "code"
  - name: "requesting_provider_phone"
    required: false
    match_type: "phone"
  - name: "acuity"
    required: false
    match_type: "exact"
  - name: "date_of_birth"
    required: false
    match_type: "date"
  - name: "servicing_provider_name"
    required: false
    match_type: "fuzzy_text"
  - name: "requesting_provider_name"
    required: false
    match_type: "fuzzy_text"
  - name: "member_name"
    required: false
    match_type: "fuzzy_text"
  - name: "place_of_service"
    required: false
    match_type: "fuzzy_text"
  - name: "requesting_provider_npi"
    required: false
    match_type: "code"
  - name: "requesting_provider_fax"
    required: false
    match_type: "phone"
  - name: "lob"
    required: false
    match_type: "fuzzy_text"
  - name: "servicing_provider_fax"
    required: false
    match_type: "phone"
  - name: "servicing_provider_phone"
    required: false
    match_type: "phone"
  - name: "servicing_provider_address"
    required: false
    match_type: "fuzzy_text"
  - name: "requesting_provider_address"
    required: false
    match_type: "fuzzy_text"
# Photometric-only augmentation chain (see src/preprocessing/preprocessing.py).
# No bbox-synced resize here since there's no bbox — just a plain resize to target_size.
augmentation:
  brightness_contrast:
    enabled: true
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.5
  sharpen:
    enabled: true
    alpha: [0.2, 0.5]
    lightness: [0.8, 1.2]
    p: 0.3
  noise:
    enabled: true
    var_limit: [10.0, 50.0]
    p: 0.3
  blur:
    enabled: true
    blur_limit: 3
    p: 0.2

training:
  num_epochs: 20
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  dataloader_num_workers: 4
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  learning_rate: 1.0e-4
  warmup_steps: 0.03
  lr_scheduler_type: "linear"
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  bf16: false
  eval_strategy: "epoch"
  eval_steps: null
  save_strategy: "epoch"
  save_steps: null
  logging_steps: 10
  metric_for_best_model: "field_accuracy"
  greater_is_better: true
  early_stopping_patience: 3
  report_to: "tensorboard"

inference:
  max_new_tokens: 4096   # a multi-field JSON payload is bigger than a 4-int bbox
  device: "cuda" 